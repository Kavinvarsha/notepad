<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Notepad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar">
    <!-- Text formatting -->
    <button id="bold-btn" title="Bold">B</button>
    <button id="italic-btn" title="Italic">I</button>
    <button id="underline-btn" title="Underline">U</button>

    <!-- Headings -->
    <select id="headings-select">
      <option value="p">Normal</option>
      <option value="h1">H1</option>
      <option value="h2">H2</option>
      <option value="h3">H3</option>
    </select>

    <!-- Font size -->
    <select id="font-size-select">
      <option value="3">Normal</option>
      <option value="4">Large</option>
      <option value="5">Larger</option>
      <option value="6">Huge</option>
    </select>

    <!-- Font style -->
    <select id="font-style-select">
      <option value="Comic Sans MS">Comic Sans</option>
      <option value="Arial">Arial</option>
      <option value="Verdana">Verdana</option>
    </select>

    <!-- Alignment -->
    <button id="left-btn" title="Left">Left</button>
    <button id="center-btn" title="Center">Center</button>
    <button id="right-btn" title="Right">Right</button>
    <button id="justify-btn" title="Justify">Justify</button>

    <!-- Lists -->
    <button id="ul-btn" title="Unordered List">&#8226; List</button>
    <button id="ol-btn" title="Ordered List">1. List</button>
    <button id="indent-btn" title="Increase Indent">&#8594; Indent</button>
    <button id="outdent-btn" title="Decrease Indent">&#8592; Outdent</button>

    <!-- Colors -->
    <input type="color" id="text-color-picker" title="Text Color">
    <input type="color" id="highlight-color-picker" title="Highlight Color">

    <!-- Insert -->
    <button id="link-btn" title="Insert Hyperlink">Link</button>
    <button id="image-btn" title="Insert Image">Image</button>
    <button id="table-btn" title="Insert Table">Table</button>
    <button id="page-break-btn">Page Break</button>

    <!-- Document operations -->
    <button id="clear-btn">Clear Format</button>
    <button id="reset-btn">Reset Editor</button>
    <button id="copy-text-btn">Copy Text</button>
    <button id="copy-html-btn">Copy HTML</button>
    <button id="preview-btn">Preview</button>
    <button id="theme-toggle">🌙 Dark Mode</button>


    <!-- File actions -->
    <button id="new-btn">New</button>
    <button id="open-btn">Open</button>
    <button id="save-btn">Save</button>
    <input type="file" id="file-input" accept=".html,.txt,.doc" style="display:none">

  
  </div>

  <div id="editor" contenteditable="true" placeholder="Start typing..."></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


  <script src="script.js"></script>
</body>
</html>
